name: 'Enterprise Terraform DevSecOps Pipeline'

# ==============================================================================
# Enterprise GitHub Actions Workflow - devops
# Author: Gunjan Kumar Gaurav (Senior Cloud & DevSecOps Consultant)
# Shift-Left Security: Checkov, Trivy, TruffleHog & Terraform Validation
# ==============================================================================

on:
  push:
    branches: [ main ]
    paths:
      - '1_Terraform/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - '1_Terraform/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  validate-and-lint:
    name: '1. Lint & Format Check'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Format Check
        run: terraform fmt -check -recursive 1_Terraform

      - name: Terraform Init
        run: terraform -chdir=1_Terraform init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=1_Terraform validate

  security-scan:
    name: '2. DevSecOps Security Gates'
    runs-on: ubuntu-latest
    needs: validate-and-lint
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: TruffleHog Secrets Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

      - name: Checkov IaC Security Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          directory: 1_Terraform
          output_format: cli
          soft_fail: true

      - name: Trivy Configuration Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '1_Terraform'
          format: 'table'
          exit-code: '0'

  speculative-plan:
    name: '3. Speculative Verification'
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Verify Terraform Initialization
        run: |
          terraform -chdir=1_Terraform init -backend=false
          echo "Infrastructure blueprint successfully verified."
