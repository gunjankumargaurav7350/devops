name: CI

on:
  push:
    branches: [main]
    paths:
      - '1_Terraform/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '1_Terraform/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Format Check
        run: terraform fmt -check -recursive 1_Terraform

      - name: Init and Validate
        run: |
          terraform -chdir=1_Terraform init -backend=false
          terraform -chdir=1_Terraform validate

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: TruffleHog Secrets Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          directory: 1_Terraform
          soft_fail: true

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: 1_Terraform
          exit-code: 0
