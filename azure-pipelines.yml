trigger:
  branches:
    include:
      - main
  paths:
    include:
      - 1_Terraform/**
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  tf_version: '1.9.5'
  tf_dir: '$(System.DefaultWorkingDirectory)/1_Terraform'

stages:
  - stage: validate
    displayName: Validate
    jobs:
      - job: tf_validate
        displayName: Terraform Validate
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(tf_version)

          - script: |
              terraform fmt -check -recursive $(tf_dir)
              terraform -chdir=$(tf_dir) init -backend=false
              terraform -chdir=$(tf_dir) validate
            displayName: Format and Validate

  - stage: security
    displayName: Security Scan
    dependsOn: validate
    jobs:
      - job: security_scan
        displayName: Checkov & Trivy
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'

          - script: |
              pip install --upgrade pip checkov
              checkov -d $(tf_dir) --framework terraform --soft-fail
            displayName: Checkov Scan

          - script: |
              curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
              trivy config $(tf_dir) --exit-code 0
            displayName: Trivy Scan
